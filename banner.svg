<svg xmlns="http://www.w3.org/2000/svg" width="500" height="50" viewBox="0 0 500 50" role="img" aria-label="Go Backend Engineer; C# and Operating Systems; Ex-Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Каждая строка выкатывается слева, держится пару секунд и уезжает вправо.
       Весь цикл 9 секунд: по 3 секунды на строку. */
    text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 26px;
      fill: #00ADD8;
      opacity: 0;
      animation: roll 9s ease-in-out infinite backwards;
    }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }

    @keyframes roll {
      0%   { transform: translateX(-80px); opacity: 0; }
      5%   { transform: translateX(0);     opacity: 1; }
      28%  { transform: translateX(0);     opacity: 1; }
      33%  { transform: translateX(80px);  opacity: 0; }
      100% { transform: translateX(80px);  opacity: 0; }
    }
  </style>
  <text class="l1" x="0" y="35">Go Backend Engineer</text>
  <text class="l2" x="0" y="35">C# &amp; Operating Systems</text>
  <text class="l3" x="0" y="35">Ex-Frontend Developer</text>
</svg>
